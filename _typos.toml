# _typos.toml
# Configuration for typos spell checker (Ref: ADR-0013)

[files]
extend-exclude = [
    ".git",
    "node_modules",
    "frontend/src/types/generated.ts",
    "assets/schema/er-diagram.mermaid",
    "seeds/*",
    "data/*"
]

[default.extend-words]
ans = "ans"
col = "col"
grp = "grp"
mem = "mem"
usr = "usr"
ser = "ser"
sng = "sng"
tygo = "tygo"
modernc = "modernc"
litestream = "litestream"
subagent = "subagent"
subagents = "subagents"
nd = "nd"

