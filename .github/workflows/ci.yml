name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-verify:
    name: Test and Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo@latest

      - name: "Verify Schema Generation (Ref: ADR-0004)"
        run: |
          ./scripts/generate-all.sh
          git diff --exit-code || {
            echo "::error::Schema artifacts out of sync. Run ./scripts/generate-all.sh locally and commit."
            exit 1
          }

      - name: "Verify Dockerfile & Base Image Integrity (Ref: ADR-0003, container-guard)"
        run: go run scripts/verify_dockerfile.go

      - name: Run Tests & Coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          {
            echo "## 🧪 Test & Coverage Summary"
            echo "| Package | Coverage |"
            echo "|---|---:|"
            go tool cover -func=coverage.out | awk '{printf("| %s | **%s** |\n", $1, $3)}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup aqua (Tool Version Manager)
        uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0

      - name: Run Biome Check (Version pinned via aqua)
        run: biome check

      - name: Run typos Spell Check (Version pinned via aqua)
        run: typos
