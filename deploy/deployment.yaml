apiVersion: apps/v1
kind: Deployment
metadata:
  name: penlight
  namespace: penlight
  labels:
    app: penlight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: penlight
  template:
    metadata:
      labels:
        app: penlight
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: penlight
          image: ghcr.io/aobaiwaki123/penlight-v2:2610a68
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATA_DIR
              value: /data
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: penlight-secret
                  key: SESSION_SECRET
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data-volume
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: penlight-data-pvc
